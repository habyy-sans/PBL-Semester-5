x-php: &php
  build:
    context: .
    dockerfile: deploy/docker/Dockerfile
  dns:
    - 1.1.1.1
    - 8.8.8.8
  user: "${WWWUSER:-1000}:${WWWGROUP:-1000}"
  environment:
    HOME: /tmp
  volumes:
    - .:/var/www/app
  restart: unless-stopped

services:
  app:
    <<: *php

  web-nginx:
    image: nginx:1.27-alpine
    profiles: [nginx]
    ports:
      - "8080:80"
      - "8443:443"
    volumes:
      - .:/var/www/app:ro
      - ./deploy/docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./deploy/docker/certs:/etc/nginx/certs:ro
    depends_on: [app]
    restart: unless-stopped

  web-apache:
    image: httpd:2.4
    profiles: [apache]
    ports:
      - "8080:80"
      - "8443:443"
    volumes:
      - .:/var/www/app:ro
      - ./deploy/docker/httpd.conf:/usr/local/apache2/conf/httpd.conf:ro
      - ./deploy/docker/certs:/usr/local/apache2/certs:ro
    depends_on: [app]
    restart: unless-stopped

  mariadb:
    image: mariadb:11.4
    profiles: [mariadb]
    environment:
      MARIADB_DATABASE: ${DB_DATABASE:-simplepos}
      MARIADB_USER: ${DB_USERNAME:-simplepos}
      MARIADB_PASSWORD: ${DB_PASSWORD:-secret}
      MARIADB_ROOT_PASSWORD: ${DB_PASSWORD:-secret}
    volumes:
      - mariadb_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      retries: 20
    networks:
      default:
        aliases: [db]
    restart: unless-stopped

  postgres:
    image: postgres:17-alpine
    profiles: [postgres]
    environment:
      POSTGRES_DB: ${DB_DATABASE:-simplepos}
      POSTGRES_USER: ${DB_USERNAME:-simplepos}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-secret}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U ${DB_USERNAME:-simplepos} -d ${DB_DATABASE:-simplepos}"]
      interval: 5s
      retries: 20
    networks:
      default:
        aliases: [db]
    restart: unless-stopped

  worker:
    <<: *php
    profiles: [workers]
    command: php artisan queue:work --sleep=3 --tries=3 --max-time=3600

  scheduler:
    <<: *php
    profiles: [workers]
    command: php artisan schedule:work

  tunnel:
    image: cloudflare/cloudflared:latest
    profiles: [tunnel]
    command: tunnel --no-autoupdate --url http://web-nginx:80
    depends_on: [web-nginx]
    restart: unless-stopped

volumes:
  mariadb_data:
  postgres_data:
